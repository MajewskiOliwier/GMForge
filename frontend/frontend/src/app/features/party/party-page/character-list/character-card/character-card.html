<button
  class="character-card"
  [class.selected]="selected"
  [class.npc]="character.isNpc"
  (click)="onClick()"
  [attr.aria-pressed]="selected"
>

  <div class="card-header">
    @if (character.isNpc) {
      <span class="badge badge-npc">NPC</span>
    } @else {
      <span class="badge badge-player">Player</span>
    }
    @if (selected) {
      <span class="selected-dot" aria-hidden="true"></span>
    }
  </div>

  <p class="character-name">{{ character.name }}</p>

  @if (!character.isNpc && character.playerUsername) {
    <p class="character-owner">{{ character.playerUsername }}</p>
  }

  <div class="card-footer">
    <span class="attr-hint">
      {{ character.attributes?.length ?? 0 }} attr
    </span>
    <span class="attr-hint">
      {{ character.focuses?.length ?? 0 }} focus
    </span>
  </div>

</button>
