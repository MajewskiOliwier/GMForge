<app-navbar />

<div class="page-content">
  <div class="container">

    <div class="heading-ornament">
      <h2>Preferences</h2>
    </div>

    <div class="pref-section">

      <h3 class="pref-section-title">Appearance</h3>
      <p class="pref-description">
        Choose your interface theme. Your preference is saved to your account
        and applied across all devices.
      </p>

      <div class="theme-options">

        <!-- Dark -->
        <button
          class="theme-card"
          [class.selected]="currentTheme === 'DARK'"
          (click)="selectTheme('DARK')"
          [disabled]="saving"
          aria-label="Dark theme"
        >
          <div class="theme-preview dark-preview">
            <div class="preview-bar"></div>
            <div class="preview-content">
              <div class="preview-line long"></div>
              <div class="preview-line short"></div>
            </div>
          </div>
          <div class="theme-label">
            <span class="theme-name">Dark</span>
            <span class="theme-desc">Black & gold — default</span>
          </div>
          @if (currentTheme === 'DARK') {
            <span class="selected-mark">◆</span>
          }
        </button>

        <!-- Light -->
        <button
          class="theme-card"
          [class.selected]="currentTheme === 'LIGHT'"
          (click)="selectTheme('LIGHT')"
          [disabled]="saving"
          aria-label="Light theme"
        >
          <div class="theme-preview light-preview">
            <div class="preview-bar"></div>
            <div class="preview-content">
              <div class="preview-line long"></div>
              <div class="preview-line short"></div>
            </div>
          </div>
          <div class="theme-label">
            <span class="theme-name">Light</span>
            <span class="theme-desc">Aged parchment & ink</span>
          </div>
          @if (currentTheme === 'LIGHT') {
            <span class="selected-mark">◆</span>
          }
        </button>

      </div>

      @if (saving) {
        <p class="pref-status saving">Saving…</p>
      }
      @if (saved) {
        <p class="pref-status success">✓ Theme saved</p>
      }
      @if (error) {
        <p class="pref-status error">{{ error }}</p>
      }

    </div>

  </div>
</div>

<app-footer />
