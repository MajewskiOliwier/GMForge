apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gmforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      env: gmforge
  template:
    metadata:
      labels:
        app: frontend
        env: gmforge
    spec:
      containers:
        - name: frontend
          image: gmforge-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "75m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: gmforge
spec:
  selector:
    app: frontend
    env: gmforge
  ports:
    - port: 80
      targetPort: 80